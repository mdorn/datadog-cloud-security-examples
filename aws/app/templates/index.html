<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab To-Do</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.4rem; }
    form.add { display: flex; gap: 8px; margin-bottom: 16px; }
    form.add input { flex: 1; padding: 8px; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
    li.done span { text-decoration: line-through; color: #888; }
    li span { flex: 1; }
    button { cursor: pointer; }
    .note { font-size: 0.8rem; color: #888; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>To-Do</h1>
  <form class="add" method="post" action="{{ url_for('add') }}">
    <input name="title" placeholder="Add a task" maxlength="200" autofocus>
    <button type="submit">Add</button>
  </form>
  <ul>
    {% for t in todos %}
    <li class="{{ 'done' if t['done'] else '' }}">
      <form method="post" action="{{ url_for('toggle', todo_id=t['id']) }}"><button>{{ '&#10003;'|safe if t['done'] else '&#9675;'|safe }}</button></form>
      <span>{{ t['title'] }}</span>
      <form method="post" action="{{ url_for('delete', todo_id=t['id']) }}"><button>&times;</button></form>
    </li>
    {% else %}
    <li><span>Nothing yet.</span></li>
    {% endfor %}
  </ul>
  <p class="note">Datadog attack path lab. Intentionally vulnerable dependencies. Sandbox use only.</p>
</body>
</html>
